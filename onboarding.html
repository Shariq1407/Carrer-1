<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onboarding — Career Mate</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="onboard-wrap">
    <div class="onboard-card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
        <img src="assets/logo.svg" width="30" alt="">
        <strong>Career Mate</strong>
        <span class="badge badge-blue" style="margin-left:auto">Setup</span>
      </div>

      <div class="onboard-steps" id="steps">
        <span class="done"></span><span></span><span></span><span></span><span></span>
      </div>

      <div id="step-body"><!-- injected --></div>

      <div class="onboard-nav">
        <button class="btn btn-outline" id="back-btn" style="visibility:hidden">← Back</button>
        <button class="btn btn-primary" id="next-btn">Next →</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    Store.load();
    const user = Store.user();
    if (!user) { location.replace('login.html'); throw new Error('CM_AUTH_REQUIRED'); }

    const state = {
      program: user.program || '',
      university: user.university || '',
      semester: user.semester || '',
      goalId: user.goalId || '',
      dailyMinutes: user.dailyMinutes || 90
    };
    let step = 1;

    const TIME_OPTIONS = [
      { v: 30,  t: '30 minutes', s: 'Light & steady' },
      { v: 60,  t: '1 hour',     s: 'Consistent pace' },
      { v: 90,  t: '1.5 hours',  s: 'Recommended' },
      { v: 120, t: '2 hours',    s: 'Serious grind' },
      { v: 180, t: '3+ hours',   s: 'Full throttle' }
    ];

    function render() {
      /* progress bar */
      $$('#steps span').forEach((s, i) => s.classList.toggle('done', i < step));
      $('#back-btn').style.visibility = step > 1 ? 'visible' : 'hidden';
      $('#next-btn').textContent = step === 5 ? 'Finish Setup ✓' : 'Next →';

      const el = $('#step-body');
      if (step === 1) {
        el.innerHTML =
          '<h2>What are you studying?</h2>' +
          '<p class="q-sub">We\'ll personalize education resources for your program.</p>' +
          '<div class="tile-group">' +
            '<div class="option-tile ' + (state.program === 'btech-cse' ? 'selected' : '') + '" data-program="btech-cse"><div class="t-icon">⚙️</div><div class="t-title">B.Tech</div><div class="t-sub">CSE / IT branches</div></div>' +
            '<div class="option-tile ' + (state.program === 'bca' ? 'selected' : '') + '" data-program="bca"><div class="t-icon">💻</div><div class="t-title">BCA</div><div class="t-sub">Bachelor of Computer Applications</div></div>' +
            '<div class="option-tile ' + (state.program === 'other' ? 'selected' : '') + '" data-program="other"><div class="t-icon">🎓</div><div class="t-title">Other</div><div class="t-sub">Any other program</div></div>' +
          '</div>';
      }
      if (step === 2) {
        el.innerHTML =
          '<h2>Select your university</h2>' +
          '<p class="q-sub">Syllabus & PYQs are organized university-wise.</p>' +
          '<div class="tile-group">' +
            CM_UNIVERSITIES.map(u =>
              '<div class="option-tile ' + (state.university === u.id ? 'selected' : '') + '" data-university="' + u.id + '">' +
                '<div class="t-icon">🏛️</div><div class="t-title">' + u.short + '</div>' +
                '<div class="t-sub">' + escapeHtml(u.name) + '</div></div>').join('') +
          '</div>';
      }
      if (step === 3) {
        el.innerHTML =
          '<h2>Select your semester</h2>' +
          '<p class="q-sub">Subject list semester ke hisaab se dikhega.</p>' +
          '<div class="tile-group cols-3">' +
            CM_SEMESTERS.map(s =>
              '<div class="option-tile ' + (state.semester === s ? 'selected' : '') + '" data-semester="' + s + '">' +
                '<div class="t-title" style="margin-top:0">Sem ' + s + '</div></div>').join('') +
          '</div>';
      }
      if (step === 4) {
        el.innerHTML =
          '<h2>What\'s your career goal?</h2>' +
          '<p class="q-sub">This powers your roadmap & daily planner.</p>' +
          '<div class="tile-group">' +
            CM_CAREERS.map(c =>
              '<div class="option-tile ' + (state.goalId === c.id ? 'selected' : '') + '" data-goal="' + c.id + '">' +
                '<div class="t-icon">' + c.icon + '</div>' +
                '<div class="t-title">' + c.name + '</div>' +
                '<div class="t-sub">' + c.difficulty + ' · ~' + c.months + ' months</div></div>').join('') +
          '</div>';
      }
      if (step === 5) {
        el.innerHTML =
          '<h2>Daily study time?</h2>' +
          '<p class="q-sub">Planner isi capacity mein tasks banayega — never overload.</p>' +
          '<div class="tile-group">' +
            TIME_OPTIONS.map(o =>
              '<div class="option-tile ' + (state.dailyMinutes === o.v ? 'selected' : '') + '" data-time="' + o.v + '">' +
                '<div class="t-icon">⏱️</div>' +
                '<div class="t-title">' + o.t + '</div>' +
                '<div class="t-sub">' + o.s + '</div></div>').join('') +
          '</div>';
      }
    }

    /* option selection */
    $('#step-body').addEventListener('click', e => {
      const t = e.target.closest('.option-tile');
      if (!t) return;
      if (t.dataset.program)     state.program = t.dataset.program;
      if (t.dataset.university)  state.university = t.dataset.university;
      if (t.dataset.semester)    state.semester = parseInt(t.dataset.semester, 10);
      if (t.dataset.goal)        state.goalId = t.dataset.goal;
      if (t.dataset.time)        state.dailyMinutes = parseInt(t.dataset.time, 10);
      $$('.option-tile').forEach(x => x.classList.remove('selected'));
      t.classList.add('selected');
    });

    $('#back-btn').onclick = () => { step = Math.max(1, step - 1); render(); };

    $('#next-btn').onclick = () => {
      /* validation */
      if (step === 1 && !state.program)    { toast('Please select your program'); return; }
      if (step === 2 && !state.university) { toast('Please select a university'); return; }
      if (step === 3 && !state.semester)   { toast('Please select a semester'); return; }
      if (step === 4 && !state.goalId)     { toast('Please select a career goal'); return; }

      if (step < 5) { step++; render(); return; }

      /* finish → save + personalize */
      const u = Store.user();
      Object.assign(u, state, { onboarded: true });
      if (state.program === 'other') u.program = 'btech-cse';
      if (state.university === 'other') u.university = 'aktu';
      if (!u.completedSkills) u.completedSkills = [];
      if (!u.inProgressSkills) u.inProgressSkills = [];
      u.goalProgress = u.completedSkills.length
        ? Math.round(u.completedSkills.length / Store.careerById(u.goalId).roadmap.length * 100) : 0;

      /* generate daily tasks from roadmap */
      const career = Store.careerById(u.goalId);
      const remaining = career.roadmap.filter(n => !u.completedSkills.includes(n.id));
      Store.tasks = Store.tasks.filter(t => t.userId !== u.id);
      const pattern = [45, 30, 60];
      let day = 0, i = 0;
      remaining.slice(0, 9).forEach(skill => {
        Store.tasks.push({
          id: 't' + Date.now() + '-' + (i++),
          userId: u.id, date: day,
          name: skill.name + ' — Practice',
          skill: skill.id,
          minutes: pattern[i % pattern.length],
          priority: day === 0 ? 'high' : (i % 3 === 0 ? 'medium' : 'low'),
          done: false
        });
        if (i % 3 === 0) day++;
      });

      Store.pushNotif('🚀', 'Onboarding complete! Your ' + career.name + ' roadmap is ready.');
      Store.save();
      location.href = 'dashboard.html';
    };

    render();
  </script>
</body>
</html>
