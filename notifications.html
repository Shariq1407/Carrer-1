<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — Career Mate</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    Store.load();
    const user = Store.user();
    initShell('notifications', { title: 'Notifications' });

    const content = document.querySelector('.content');
    const notifs = Store.myNotifs();

    content.innerHTML =
      '<div class="content-head"><div><h1>Notifications</h1>' +
        '<p>' + Store.unreadCount() + ' unread</p></div>' +
        '<button class="btn btn-outline" id="mark-read">Mark All Read</button></div>' +

      (notifs.length
        ? notifs.map(n =>
          '<div class="notif-item' + (n.unread ? ' unread' : '') + '">' +
            '<div class="n-ico">' + n.icon + '</div>' +
            '<div><div class="n-title">' + escapeHtml(n.title) + '</div>' +
            '<div class="n-time">' + n.time + '</div></div>' +
            (n.unread ? '<span class="badge badge-blue" style="margin-left:auto">New</span>' : '') +
          '</div>').join('')
        : '<div class="card center" style="padding:40px"><p class="muted">No notifications yet.</p></div>');

    $('#mark-read').onclick = () => {
      Store.markAllRead();
      toast('All marked as read ✅');
      setTimeout(() => location.reload(), 300);
    };
  </script>
</body>
</html>
