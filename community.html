<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community — Career Mate</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
    Store.load();
    const user = Store.user();
    initShell('community', { title: 'Community' });

    const content = document.querySelector('.content');
    let activeCommunity = 'btech-cse-aktu';
    let q = '';

    function render() {
      const comm = CM_COMMUNITIES.find(c => c.id === activeCommunity);
      let posts = Store.posts.filter(p => p.communityId === activeCommunity);
      if (q) posts = posts.filter(p =>
        (p.title + ' ' + p.body).toLowerCase().includes(q.toLowerCase()));

      content.innerHTML =
        '<div class="content-head"><div><h1>Community</h1>' +
          '<p>Apne college ke students se pucho, share karo, grow karo.</p></div>' +
          '<button class="btn btn-primary" id="new-post">+ New Post</button></div>' +

        /* community switcher + search */
        '<div class="crumbs" style="row-gap:8px">' +
          CM_COMMUNITIES.map(c =>
            '<button class="btn btn-sm ' + (c.id === activeCommunity ? 'btn-primary' : 'btn-outline') + '" data-comm="' + c.id + '">' +
              escapeHtml(c.name) + ' (' + c.members + ')</button>').join('') +
        '</div>' +
        '<div class="form-field" style="max-width:360px">' +
          '<input id="comm-search" placeholder="🔍 Search posts…" value="' + escapeHtml(q) + '">' +
        '</div>' +

        /* posts */
        '<div id="posts-area">' +
          (posts.length ? posts.map(p =>
            '<div class="post-card">' +
              '<div class="post-head">' +
                '<div class="avatar">' + escapeHtml(p.author.charAt(0)) + '</div>' +
                '<div><div class="p-author">' + escapeHtml(p.author) + '</div>' +
                '<div class="p-time">' + p.time + '</div></div>' +
                (p.reported ? '<span class="badge badge-red" style="margin-left:auto">Reported</span>' : '') +
              '</div>' +
              '<h3>' + escapeHtml(p.title) + '</h3>' +
              '<p class="post-body">' + escapeHtml(p.body) + '</p>' +
              '<div class="post-foot">' +
                '<button class="vote-btn ' + (p.userVote === 1 ? 'up-active' : '') + '" data-vote="1" data-post="' + p.id + '">👍 <span>' + p.up + '</span></button>' +
                '<button class="vote-btn ' + (p.userVote === -1 ? 'down-active' : '') + '" data-vote="-1" data-post="' + p.id + '">👎 <span>' + p.down + '</span></button>' +
                '<button class="vote-btn" data-comments="' + p.id + '">💬 ' + p.comments.length + ' Comments</button>' +
                '<button class="vote-btn" data-report="' + p.id + '" style="margin-left:auto">🚩 Report</button>' +
              '</div>' +
              '<div id="comments-' + p.id + '" style="display:none;margin-top:12px">' +
                (p.comments.map(c =>
                  '<div class="comment"><div class="c-author">' + escapeHtml(c.author) + ' <span class="p-time">· ' + c.time + '</span></div>' +
                  '<div>' + escapeHtml(c.text) + '</div></div>').join('') || '<p class="muted small">No comments yet.</p>') +
                '<div class="form-field" style="margin-top:10px;margin-bottom:0">' +
                  '<input placeholder="Write a comment…" data-comment-input="' + p.id + '">' +
                '</div>' +
              '</div>' +
            '</div>').join('')
          : '<div class="card center" style="padding:40px"><p class="muted">No posts' + (q ? ' matching "' + escapeHtml(q) + '"' : '') +
            '. Be the first to post!</p></div>') +
        '</div>';

      /* events */
      $$('[data-comm]').forEach(b => b.onclick = () => { activeCommunity = b.dataset.comm; render(); });

      const si = $('#comm-search');
      si.oninput = e => { q = e.target.value; render();
        const nsi = $('#comm-search'); if (nsi) { nsi.focus(); } };

      $('#new-post').onclick = () => openModal(
        '<h3>Create Post</h3>' +
        '<div class="form-field"><label>Title</label><input id="np-title" placeholder="Ask something…"></div>' +
        '<div class="form-field"><label>Details</label><textarea id="np-body" rows="4" placeholder="Explain your question…"></textarea></div>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-outline" onclick="closeModal()">Cancel</button>' +
          '<button class="btn btn-primary" id="np-save">Post</button></div>');
      $('#np-save').onclick = () => {
        const t = $('#np-title').value.trim();
        const b = $('#np-body').value.trim();
        if (!t) { toast('Title required'); return; }
        Store.addPost(t, b || '—', activeCommunity);
        closeModal();
        toast('Posted ✅');
        render();
      };
    }

    /* votes / comments / report (delegated, survives re-render) */
    content.addEventListener('click', e => {
      const v = e.target.closest('[data-vote]');
      if (v) {
        Store.votePost(v.dataset.post, parseInt(v.dataset.vote, 10));
        render();
        return;
      }
      const cb = e.target.closest('[data-comments]');
      if (cb) {
        const panel = $('#comments-' + cb.dataset.comments);
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        return;
      }
      const rep = e.target.closest('[data-report]');
      if (rep) {
        Store.reportPost(rep.dataset.report);
        toast('Post reported. Moderators will review. 🚩');
        render();
        return;
      }
      if (e.target.key === 'Enter') return;
    });

    /* comment submit on Enter */
    content.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const inp = e.target.closest('[data-comment-input]');
      if (!inp) return;
      const text = inp.value.trim();
      if (!text) return;
      Store.addComment(inp.dataset.commentInput, text);
      toast('Comment added 💬');
      render();
    });

    render();
  </script>
</body>
</html>
